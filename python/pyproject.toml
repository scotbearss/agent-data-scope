[project]
name = "agent-data-scope"
version = "0.1.0"
description = "A governance layer for LangChain Deep Agents that proves an agent touched only the data its task needed."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.0",
    "deepagents",
    "langsmith",
    "pyyaml",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agent-data-scope = "agent_data_scope.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_data_scope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
