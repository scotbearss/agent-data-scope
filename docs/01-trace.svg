<svg width="680" viewBox="0 0 680 960" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>One agent run as a trace</title><style>.th{font-size:14px;font-weight:500;fill:#26215C}.ts{font-size:12px;fill:#534AB7}.gh{fill:#2C2C2A}.gs{fill:#5F5E5A}.tt{fill:#04342C}.tu{fill:#0F6E56}.ch{fill:#4A1B0C}.cs{fill:#993C1D}.lane{fill:none;stroke:#888780;stroke-width:0.5;stroke-dasharray:4 3}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
