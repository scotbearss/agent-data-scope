<svg width="680" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title>Necessity: fetched versus cited</title><style>.th{font-size:14px;font-weight:500}.ts{font-size:12px}.p{fill:#26215C}.ps{fill:#534AB7}.g{fill:#2C2C2A}.gs{fill:#5F5E5A}.t{fill:#04342C}.tu{fill:#0F6E56}.c{fill:#4A1B0C}.cs{fill:#993C1D}.lane{fill:none;stroke:#888780;stroke-width:0.5;stroke-dasharray:4 3}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="290" height="200" rx="4" class="lane"/><text class="th g" x="185" y="58" text-anchor="middle">Fetched (from the gate)</text>
<rect x="350" y="40" width="290" height="200" rx="4" class="lane"/><text class="th g" x="495" y="58" text-anchor="middle">Cited (from the report)</text>
<g><rect x="55" y="80" width="260" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th t" x="185" y="98" text-anchor="middle">Used</text><text class="ts tu" x="185" y="114" text-anchor="middle">snapshot:fictional:signals</text></g>
<g><rect x="55" y="140" width="260" height="44" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="th c" x="185" y="158" text-anchor="middle">Unused</text><text class="ts cs" x="185" y="174" text-anchor="middle">snapshot:fictional:heartbeat</text></g>
<g><rect x="55" y="196" width="260" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="ts gs" x="185" y="216" text-anchor="middle">dropped record never counted: it was not seen</text></g>
<g><rect x="365" y="80" width="260" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th t" x="495" y="98" text-anchor="middle">Used</text><text class="ts tu" x="495" y="114" text-anchor="middle">snapshot:fictional:signals</text></g>
<g><rect x="365" y="140" width="260" height="44" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th c" x="495" y="158" text-anchor="middle">Cited but not fetched</text><text class="ts cs" x="495" y="174" text-anchor="middle">none this run: integrity ok</text></g>
<line x1="315" y1="102" x2="365" y2="102" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line class="arr" x1="185" y1="240" x2="185" y2="272" marker-end="url(#a)"/><line class="arr" x1="495" y1="240" x2="495" y2="272" marker-end="url(#a)"/>
<g><rect x="55" y="276" width="570" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th g" x="340" y="294" text-anchor="middle">Score = used / fetched</text><text class="ts gs" x="340" y="310" text-anchor="middle">1 / 2 = 0.5, computed with no model call, in under a millisecond</text></g>
<line class="arr" x1="340" y1="320" x2="340" y2="352" marker-end="url(#a)"/>
<g><rect x="55" y="356" width="570" height="44" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th p" x="340" y="374" text-anchor="middle">LangSmith feedback on the run</text><text class="ts ps" x="340" y="390" text-anchor="middle">key data_necessity_v1, score 0.5, comment names the unused record</text></g>
<g><rect x="55" y="440" width="170" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th t" x="140" y="460" text-anchor="middle">Used</text></g>
<g><rect x="255" y="440" width="170" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="th c" x="340" y="460" text-anchor="middle">Unused or suspicious</text></g>
<g><rect x="455" y="440" width="170" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th p" x="540" y="460" text-anchor="middle">Recorded in LangSmith</text></g>
</svg>
